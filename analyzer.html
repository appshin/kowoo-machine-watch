<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="app-version" content="20261120p">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOWOO Thai 분석 PC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='14' height='10' rx='2' fill='%2317202B'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%231FA5C4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261120p">
</head>
<body>
<div id="setupMsg" class="setup" hidden></div>

<section id="login" class="login" hidden>
  <form class="login-box">
    <div class="brand-row"><span class="brand-mark"></span><strong data-i18n="analyzerTitle"></strong></div>
    <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="username" required></label>
    <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn primary" data-i18n="login"></button>
    <p class="login-msg" role="alert"></p>
    <select class="lang-select" aria-label="Language">
      <option value="ko">한국어</option><option value="en">English</option><option value="th">ไทย</option>
    </select>
  </form>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" id="brandMark"></span><span data-i18n="analyzerTitle"></span></div>
    <a class="top-link" href="index.html" target="kcw_dash" rel="noopener" data-i18n="backDash"></a>
    <a class="top-link" href="room.html" target="kcw_room" rel="noopener" data-i18n="openRoom"></a>
    <a class="top-link" href="history.html" target="kcw_hist" rel="noopener" data-i18n="openHistory"></a>
    <select class="lang-select" aria-label="Language">
      <option value="ko">한국어</option><option value="en">English</option><option value="th">ไทย</option>
    </select>
    <button type="button" data-action="logout" data-i18n="logout"></button>
  </header>

  <div id="warn" class="warn" hidden></div>

  <section class="toolbar panel">
    <label class="field"><span data-i18n="agentName"></span><input id="agentName" maxlength="24" size="12"></label>
    <button id="runBtn" type="button" class="btn primary"></button>
    <label class="check"><input type="checkbox" id="autoStart"><span data-i18n="autoStart"></span></label>
    <label class="field"><span data-i18n="tileSize"></span>
      <select id="tileSize">
        <option value="s" data-i18n="sizeS"></option>
        <option value="m" data-i18n="sizeM"></option>
        <option value="l" data-i18n="sizeL"></option>
        <option value="xl" data-i18n="sizeXL"></option>
      </select>
    </label>
    <span id="engineStatus" class="meta"></span>
    <span class="spacer"></span>
    <button id="selectBtn" type="button" class="btn admin-only" data-i18n="selMode"></button>
    <button id="splitBtn" type="button" class="btn admin-only" data-i18n="splitTool"></button>
    <button id="newWinBtn" type="button" class="btn admin-only" data-i18n="newWin"></button>
    <button id="addCamBtn" type="button" class="btn admin-only" data-i18n="addCamera"></button>
    <button id="settingsBtn" type="button" class="btn admin-only" data-i18n="settings"></button>
    <button id="alertBtn" type="button" class="btn admin-only" data-i18n="alertSettings"></button>
  </section>
  <p class="hint" style="margin:8px 20px 0" data-i18n="agentHint"></p>

  <div id="selBar" class="sel-bar" hidden>
    <b id="selCount"></b>
    <button type="button" id="selAll" class="btn small" data-i18n="selAll"></button>
    <button type="button" id="selNone" class="btn small" data-i18n="selNone"></button>
    <span class="spacer"></span>
    <button type="button" id="selDelete" class="btn danger" data-i18n="selDelete"></button>
    <button type="button" id="selCancel" class="btn" data-i18n="cancel"></button>
  </div>
  <main id="tiles" class="tiles"></main>
</div>

<!-- 카메라 설정 -->
<dialog id="camDlg">
  <form id="camForm" class="dlg-form">
    <h3 data-i18n="editCamera"></h3>
    <label class="field"><span data-i18n="camName"></span><input name="name" required maxlength="40"></label>
    <label class="field"><span data-i18n="camArea"></span><select name="area" class="area-select"></select></label>
    <label class="field"><span data-i18n="assignPc"></span><input name="agent" required maxlength="24"></label>
    <label class="field"><span data-i18n="srcType"></span>
      <select name="type">
        <option value="screen" data-i18n="srcScreen"></option>
        <option value="image" data-i18n="srcImage"></option>
        <option value="url" data-i18n="srcUrl"></option>
        <option value="webcam" data-i18n="srcWebcam"></option>
        <option value="mp4" data-i18n="srcMp4"></option>
        <option value="jpeg" data-i18n="srcJpeg"></option>
      </select>
    </label>
    <p class="src-screen hint" data-i18n="screenHint"></p>
    <p class="src-image hint" data-i18n="imageHint"></p>
    <div class="src-url">
      <label class="field"><span data-i18n="urlLabel"></span><input name="url" type="url" placeholder="https://"></label>
      <p class="hint" data-i18n="urlHint"></p>
    </div>
    <div class="src-go2rtc">
      <label class="field"><span data-i18n="streamName"></span><input name="stream" placeholder="f1_cam1" maxlength="60"></label>
      <label class="field" style="margin-top:12px"><span data-i18n="baseUrl"></span><input name="base" placeholder="http://localhost:1984"></label>
    </div>
    <div class="src-webcam">
      <label class="field"><span data-i18n="webcamDevice"></span><select name="deviceId"></select></label>
      <button type="button" id="loadCams" class="btn small" style="margin-top:8px" data-i18n="loadWebcams"></button>
    </div>
    <div id="cropRow" class="row">
      <span class="meta"><span data-i18n="cropLabel"></span>: <b id="cropState"></b></span>
      <button type="button" id="cropPick" class="btn small" data-i18n="cropPick"></button>
      <button type="button" id="cropReset" class="btn small" data-i18n="cropReset"></button>
    </div>
    <div class="row">
      <button type="submit" class="btn primary" data-i18n="save"></button>
      <button type="button" class="btn" data-close data-i18n="cancel"></button>
      <span class="spacer"></span>
      <button type="button" id="camDel" class="btn danger" data-i18n="delete"></button>
    </div>
  </form>
</dialog>

<!-- 설비 영역 편집 -->
<dialog id="zoneDlg" class="zone-dlg">
  <div class="zone-wrap">
    <div class="zone-canvas-wrap"><canvas id="zoneCanvas"></canvas></div>
    <div class="zone-side">
      <h3 id="zoneCamName"></h3>
      <p class="hint" data-i18n="zoneHelp"></p>
      <div id="zoneMode" class="draw-toggle">
        <button type="button" data-mode="rect" data-i18n="modeRect"></button>
        <button type="button" data-mode="poly" data-i18n="modePoly"></button>
      </div>
      <p class="hint" data-i18n="shapeHint"></p>
      <ul id="zoneList" class="zone-list"></ul>
      <button type="button" id="zoneNew" class="btn small" data-i18n="addZone"></button>
      <form id="zoneForm" class="zone-form">
        <label class="field"><span data-i18n="eqId"></span><input name="eqId" maxlength="20" placeholder="CNC-B2"></label>
        <label class="field"><span data-i18n="eqName"></span><input name="name" maxlength="40"></label>
        <label class="field"><span data-i18n="camArea"></span><select name="area" class="area-select"></select></label>
        <label class="field"><span data-i18n="windowMin"></span><input name="windowMin" type="number" min="1" max="60" step="1"></label>
        <label class="field"><span data-i18n="minRatio"></span><input name="minRatio" type="number" min="1" max="95" step="1"></label>
        <label class="field"><span><span data-i18n="sens"></span> <b id="sensVal"></b></span><input name="sens" type="range" min="1" max="10" step="1"></label>
        <p id="zoneState" class="hint"></p>
        <div class="row">
          <button type="submit" class="btn primary" data-i18n="saveZone"></button>
          <button type="button" id="zoneDel" class="btn danger" data-i18n="delete"></button>
        </div>
      </form>
      <button type="button" id="zoneClose" class="btn" data-i18n="close"></button>
    </div>
  </div>
</dialog>

<!-- 분석 설정 -->
<dialog id="setDlg">
  <form id="setForm" class="dlg-form">
    <h3 data-i18n="settings"></h3>
    <label class="field"><span data-i18n="analyzeMs"></span><input name="analyzeMs" type="number" min="300" max="10000" step="100"></label>
    <label class="field"><span data-i18n="pixThresh"></span><input name="pixThresh" type="number" min="5" max="80" step="1"></label>
    <label class="field"><span data-i18n="skipPct"></span><input name="skipPct" type="number" min="10" max="100" step="5"></label>
    <label class="field"><span data-i18n="frameMs"></span><input name="frameMs" type="number" min="1000" max="10000" step="500"></label>
    <label class="field"><span data-i18n="frameW"></span><input name="frameW" type="number" min="480" max="1280" step="80"></label>
    <label class="field"><span data-i18n="refMatch"></span><input name="refMatch" type="number" min="0.3" max="0.95" step="0.05"></label>
    <label class="field"><span data-i18n="unseenMin"></span><input name="unseenMin" type="number" min="1" max="240" step="1"></label>
    <div class="row">
      <button type="submit" class="btn primary" data-i18n="save"></button>
      <button type="button" class="btn" data-close data-i18n="cancel"></button>
    </div>
  </form>
</dialog>

<!-- LINE 알림 설정 -->
<dialog id="alertDlg">
  <form id="alertForm" class="dlg-form">
    <h3 data-i18n="alertSettings"></h3>
    <label class="check"><input name="enabled" type="checkbox"><span data-i18n="alEnabled"></span></label>
    <label class="field"><span data-i18n="alUrl"></span><input name="url" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
    <label class="field"><span data-i18n="alKey"></span><input name="key" maxlength="80"></label>
    <label class="field"><span data-i18n="alDelay"></span><input name="delayMin" type="number" min="1" max="240"></label>
    <label class="field"><span data-i18n="alRepeat"></span><input name="repeatMin" type="number" min="0" max="1440"></label>
    <label class="check"><input name="resolved" type="checkbox"><span data-i18n="alResolved"></span></label>
    <label class="field"><span data-i18n="alQuiet"></span><input name="quiet" placeholder="12:00-13:00, 00:00-00:30"></label>
    <fieldset class="lang-checks"><legend data-i18n="alLangs"></legend>
      <label class="check"><input type="checkbox" name="langs" value="th">ไทย</label>
      <label class="check"><input type="checkbox" name="langs" value="ko">한국어</label>
      <label class="check"><input type="checkbox" name="langs" value="en">English</label>
    </fieldset>
    <label class="field"><span data-i18n="alRoomUrl"></span><input name="roomUrl" type="url"></label>
    <p class="hint" data-i18n="alHint"></p>
    <div class="row">
      <button type="submit" class="btn primary" data-i18n="save"></button>
      <button type="button" id="alertTest" class="btn" data-i18n="alTest"></button>
      <button type="button" class="btn" data-close data-i18n="cancel"></button>
    </div>
  </form>
</dialog>

<!-- 화면 영역 지정 / 분할 화면 나누기 -->
<dialog id="cropDlg" class="zone-dlg">
  <div class="zone-wrap">
    <div class="zone-canvas-wrap"><canvas id="cropCanvas"></canvas></div>
    <div class="zone-side">
      <h3 id="cropTitle"></h3>
      <p id="cropHelp" class="hint"></p>
      <form id="splitForm" class="zone-form" onsubmit="return false">
        <div id="splitFields">
          <div class="row">
            <label class="field"><span data-i18n="splitRows"></span><input name="rows" type="number" min="1" max="8" value="4" size="3"></label>
            <label class="field"><span data-i18n="splitCols"></span><input name="cols" type="number" min="1" max="8" value="4" size="3"></label>
          </div>
          <label class="field"><span data-i18n="splitPrefix"></span><input name="prefix" value="CH" maxlength="20"></label>
          <label class="field"><span data-i18n="splitStart"></span><input name="start" type="number" min="1" value="1"></label>
          <label class="field"><span data-i18n="camArea"></span><select name="area"></select></label>
        </div>
      </form>
      <div class="row">
        <button type="button" id="cropOk" class="btn primary"></button>
        <button type="button" id="cropCancel" class="btn" data-i18n="cancel"></button>
      </div>
    </div>
  </div>
</dialog>

<script>
/* 화면 파일과 기능 파일(assets)이 서로 다른 업데이트면 경고 */
setTimeout(function () {
  var hv = document.querySelector('meta[name="app-version"]').content;
  if (window.__KCW_VERSION === hv) return;
  var el = document.getElementById("setupMsg");
  el.textContent = "업데이트가 일부만 반영됐습니다. GitHub의 assets 폴더 안으로 들어가 새 파일들을 다시 올린 뒤 Ctrl+F5를 누르세요. / The update is only partly applied: upload the files inside the assets folder again, then press Ctrl+F5. (" + hv + " / " + (window.__KCW_VERSION || "old") + ")";
  el.hidden = false;
}, 4000);
</script>
<script type="module" src="assets/analyzer.js?v=20261120p"></script>
</body>
</html>
