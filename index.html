<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOWOO Thai 설비 가동 감시</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23D2201A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="setupMsg" class="setup" hidden></div>

<section id="login" class="login" hidden>
  <form class="login-box">
    <div class="brand-row"><span class="brand-mark alert"></span><strong data-i18n="appTitle"></strong></div>
    <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="username" required></label>
    <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn primary" data-i18n="login"></button>
    <p class="login-msg" role="alert"></p>
    <select class="lang-select" aria-label="Language">
      <option value="ko">한국어</option><option value="en">English</option><option value="th">ไทย</option>
    </select>
  </form>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" id="brandMark"></span><span data-i18n="appTitle"></span></div>
    <div class="clock"><span data-i18n="siteTime"></span><b id="clkSite">--:--</b></div>
    <div class="clock"><span data-i18n="krTime"></span><b id="clkHome">--:--</b></div>
    <a class="top-link" href="room.html" data-i18n="openRoom"></a>
    <a class="top-link admin-only" href="analyzer.html" data-i18n="openAnalyzer"></a>
    <button id="soundBtn" type="button" aria-pressed="false" data-i18n="sound"></button>
    <select class="lang-select" aria-label="Language">
      <option value="ko">한국어</option><option value="en">English</option><option value="th">ไทย</option>
    </select>
    <button type="button" data-action="logout" data-i18n="logout"></button>
  </header>

  <section class="andon" aria-live="polite">
    <div class="andon-head">
      <h1 id="andonTitle" class="andon-title"></h1>
      <div id="tally" class="tally"></div>
    </div>
    <div id="andonStrip" class="andon-strip"></div>
  </section>

  <main class="layout">
    <section class="panel area-viewer">
      <h2><span data-i18n="cameras"></span><span class="row"><span id="camMeta" class="meta"></span><button type="button" id="rzOpen" class="btn small admin-only" data-i18n="editZonesRemote"></button></span></h2>
      <div id="camTabs" class="cam-tabs"></div>
      <div id="stage" class="stage">
        <img id="frameImg" alt="">
        <canvas id="overlay"></canvas>
        <p id="stageMsg" class="stage-msg"></p>
      </div>
    </section>

    <section class="panel area-idle">
      <h2><span data-i18n="idleNow"></span><span id="idleCount" class="count">0</span></h2>
      <ul id="idleList" class="idle-list"></ul>
      <div id="offWrap"></div>
    </section>

    <section class="panel area-stats">
      <h2>
        <span data-i18n="shiftStats"></span>
        <span class="stat-ctrl">
          <input type="date" id="statDate" aria-label="date">
          <select id="statShift" aria-label="shift">
            <option value="D" data-i18n="day"></option>
            <option value="N" data-i18n="night"></option>
          </select>
        </span>
      </h2>
      <div class="panel-body table-wrap"><table id="statTable" class="stat-table"></table></div>
    </section>

    <section class="panel area-events">
      <h2 data-i18n="events"></h2>
      <ol id="eventList" class="event-list"></ol>
    </section>
  </main>
</div>

<!-- 원격 감시 박스 편집 (admin) -->
<dialog id="rzDlg" class="zone-dlg">
  <div class="zone-wrap">
    <div class="zone-canvas-wrap"><canvas id="rzCanvas"></canvas></div>
    <div class="zone-side">
      <h3 id="rzCamName"></h3>
      <p class="hint" data-i18n="rzHelp"></p>
      <p id="rzWait" class="hint warn-text" data-i18n="rzWait"></p>
      <p class="hint" data-i18n="zoneHelp"></p>
      <div id="rzMode" class="draw-toggle">
        <button type="button" data-mode="rect" data-i18n="modeRect"></button>
        <button type="button" data-mode="poly" data-i18n="modePoly"></button>
      </div>
      <p class="hint" data-i18n="shapeHint"></p>
      <ul id="rzList" class="zone-list"></ul>
      <button type="button" id="rzNew" class="btn small" data-i18n="addZone"></button>
      <form id="rzForm" class="zone-form">
        <label class="field"><span data-i18n="eqId"></span><input name="eqId" maxlength="20" placeholder="CNC-B2"></label>
        <label class="field"><span data-i18n="eqName"></span><input name="name" maxlength="40"></label>
        <label class="field"><span data-i18n="camArea"></span><select name="area" class="area-select"></select></label>
        <label class="field"><span data-i18n="windowMin"></span><input name="windowMin" type="number" min="1" max="60" step="1"></label>
        <label class="field"><span data-i18n="minRatio"></span><input name="minRatio" type="number" min="1" max="95" step="1"></label>
        <label class="field"><span><span data-i18n="sens"></span> <b id="rzSensVal"></b></span><input name="sens" type="range" min="1" max="10" step="1"></label>
        <p id="rzState" class="hint"></p>
        <div class="row">
          <button type="submit" class="btn primary" data-i18n="saveZone"></button>
          <button type="button" id="rzDel" class="btn danger" data-i18n="delete"></button>
        </div>
      </form>
      <button type="button" id="rzClose" class="btn" data-i18n="close"></button>
    </div>
  </div>
</dialog>

<script type="module" src="assets/dashboard.js"></script>
</body>
</html>
