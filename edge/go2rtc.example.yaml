# go2rtc 설정 예시 — 이 파일을 go2rtc.yaml 로 복사한 뒤 카메라 주소/비밀번호를 입력하세요.
# go2rtc.yaml 은 .gitignore 에 들어 있어 GitHub에 올라가지 않습니다. (CCTV 비밀번호 보호)

api:
  listen: "127.0.0.1:1984"   # 이 PC 안에서만 접속 가능 (외부 노출 안 함)
  static_dir: "."            # 저장소 폴더를 웹으로 제공 → http://localhost:1984/analyzer.html

streams:
  # 분석에는 서브스트림(저해상도, H.264)을 쓰세요. H.265면 브라우저가 못 읽을 수 있습니다.

  # Hikvision 예시 (채널1 서브스트림 = 102)
  f1_cam1: rtsp://admin:PASSWORD@192.168.1.64:554/Streaming/Channels/102

  # Dahua 예시 (subtype=1 = 서브스트림)
  f1_cam2: rtsp://admin:PASSWORD@192.168.1.65:554/cam/realmonitor?channel=1&subtype=1

  # NVR 한 대에 여러 채널이 있는 경우 (Hikvision NVR 채널3 서브스트림 = 302)
  f2_cam1: rtsp://admin:PASSWORD@192.168.1.100:554/Streaming/Channels/302

  # 카메라가 H.265만 지원하면 ffmpeg로 H.264 변환 (CPU 사용 증가)
  # f3_cam1: ffmpeg:rtsp://admin:PASSWORD@192.168.1.66:554/stream2#video=h264
